<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poema e Imagen</title>
    <!-- Importación de fuente estilo caligrafía/poema -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Great+Vibes&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #e65c5c; /* Mismo fondo rojo suave */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            box-sizing: border-box;
            overflow-x: hidden;
            position: relative;
        }

        /* Sección del Poema */
        .poem-container {
            text-align: center;
            max-width: 650px;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.15);
            margin-bottom: 25px;
            z-index: 2;
        }

        .poem-title {
            font-family: 'Great Vibes', cursive;
            font-size: 48px;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .poem-verses {
            font-family: 'Dancing Script', cursive;
            font-size: 26px;
            line-height: 1.6;
        }

        /* Botón de Música */
        .music-container {
            margin-bottom: 25px;
            z-index: 2;
        }

        .btn-music {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 10px 24px;
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            background-color: rgba(255, 255, 255, 0.25);
            border: 2px solid #ffffff;
            border-radius: 30px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .btn-music:hover {
            background-color: rgba(255, 255, 255, 0.4);
            transform: scale(1.05);
        }

        /* Contenedor de Botones Sí / No */
        .buttons-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
            z-index: 2;
        }

        .btn {
            display: inline-block;
            padding: 12px 32px;
            font-size: 18px;
            font-weight: 600;
            color: #3a2e2b;
            background-color: #fff3b0; /* Amarillo pastel */
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            transition: all 0.3s ease;
        }

        .btn:hover {
            background-color: #ffe66d;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
        }

        /* Contenedor de la Imagen */
        .image-container {
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
        }

        .image-container img {
            width: 100%;
            height: auto;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            object-fit: cover;
        }

        /* Estilos de los Emojis Cayendo (Lluvia) */
        .emoji-drop {
            position: fixed;
            top: -50px;
            font-size: 28px;
            user-select: none;
            pointer-events: none;
            z-index: 9999;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to {
                transform: translateY(105vh) rotate(360deg);
            }
        }
    </style>
</head>
<body>

    <!-- SECCIÓN DE POEMA -->
    <div class="poem-container">
        <h1 class="poem-title">Se la Penélope de mi Odiseo</h1>
        <div class="poem-verses">
            <p>Me permitirias conocerte mejor para que tal vez en algun momento seas mi Penélope?<br> - dice en Odiseo jssjsj 😉</p>
        </div>
    </div>


    <!-- BOTONES SÍ Y NO -->
    <div class="buttons-container">
        <button class="btn" onclick="lanzarConfeti()">Sí</button>
        <button class="btn" onclick="cerrarPagina()">No</button>
    </div>

    <!-- BOTÓN PARA REPRODUCIR MÚSICA -->
    <div class="music-container">
        <button class="btn-music" onclick="toggleMusica()">
            <span id="music-icon">🎵</span> <span id="music-text">Reproducir Música</span>
        </button>
        <!-- Elemento de audio invisible configurado a la carpeta msc -->
        <audio id="miAudio" loop>
            <!-- Reemplaza 'cancion.mp3' por el nombre exacto de tu archivo en la carpeta msc -->
            <source src="msc/Would You Fall in Love with Me Again.mp3" type="audio/mpeg">
            Tu navegador no soporta el elemento de audio.
        </audio>
    </div>

    <!-- SECCIÓN PARA TU IMAGEN -->
    <div class="image-container">
        <img src="img/e57882c3ccb526a56db9222f993333fd.jpg" alt="Imagen del poema">
    </div>

    <script>
        // Función para reproducir y pausar la música
        const audio = document.getElementById('miAudio');
        const musicText = document.getElementById('music-text');
        const musicIcon = document.getElementById('music-icon');

        function toggleMusica() {
            if (audio.paused) {
                audio.play();
                musicText.innerText = 'Pausar Música';
                musicIcon.innerText = '⏸️';
            } else {
                audio.pause();
                musicText.innerText = 'Reproducir Música';
                musicIcon.innerText = '🎵';
            }
        }

        // Función al hacer clic en SÍ
        function lanzarConfeti() {
            // Intenta reproducir la música si no estaba sonar previamente
            if (audio.paused) {
                toggleMusica();
            }

            const emojis = ['🎉', '💖', '💕', '✨', '🌸', '❤️', '🌹'];
            
            const interval = setInterval(() => {
                for (let i = 0; i < 5; i++) {
                    crearEmoji(emojis);
                }
            }, 100);

            setTimeout(() => {
                clearInterval(interval);
            }, 12000);
        }

        function crearEmoji(emojis) {
            const emoji = document.createElement('div');
            emoji.classList.add('emoji-drop');
            emoji.innerText = emojis[Math.floor(Math.random() * emojis.length)];
            emoji.style.left = Math.random() * 100 + 'vw';
            emoji.style.animationDuration = Math.random() * 2 + 2 + 's';
            emoji.style.fontSize = Math.random() * 20 + 20 + 'px';

            document.body.appendChild(emoji);

            setTimeout(() => {
                emoji.remove();
            }, 4000);
        }

        // Función al hacer clic en NO
        function cerrarPagina() {
            window.close();
            setTimeout(() => {
                document.body.innerHTML = "<h1 style='color:white; text-align:center; margin-top:40vh; font-family:sans-serif;'>Página cerrada ❤️</h1>";
            }, 200);
        }
    </script>

</body>
</html>
